# Builds installers for Windows (NSIS + zip), macOS (.dmg, arm64 and x86_64) and Linux (.tar.gz),
# runs the self-checks, and uploads the packages as artifacts. Runs on version tags (v*) or by hand.
# A tag also publishes a GitHub Release with the packages (the in-app updater reads those): tags with a
# "-" (v0.3.0-beta.1) are pre-releases. Release: bump nothing, just `git tag v0.2.0 && git push origin v0.2.0`.
name: release
on:
  push:
    branches: [main]  # build + self-checks on every push; only tags publish a release
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-arm64, os: macos-15, arch: arm64 }
          - { name: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { name: linux-x86_64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    env:
      # the tag (v0.2.0) on tag builds; hand-run builds are <project version>-dev
      OPCAN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Fetch Stockfish (Linux/macOS)
        if: runner.os != 'Windows'
        run: packaging/fetch-stockfish.sh packaging/stockfish
      - name: Fetch Stockfish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/fetch-stockfish.ps1 -Out packaging/stockfish

      - name: Put Stockfish on PATH for the self-checks
        shell: bash
        run: echo "${{ github.workspace }}/packaging/stockfish" >> "$GITHUB_PATH"

      # the installer builder (no longer preinstalled on windows-latest)
      - name: NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      # no -G: the newest installed Visual Studio (the runner images move to new versions)
      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DOPCAN_VERSION="${{ env.OPCAN_VERSION }}" -DOPCAN_VULKAN=OFF -DOPCAN_STOCKFISH_PATH="${{ github.workspace }}/packaging/stockfish/stockfish.exe"
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DOPCAN_VERSION="$OPCAN_VERSION" -DOPCAN_STOCKFISH_PATH="$PWD/packaging/stockfish/stockfish"
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPCAN_VERSION="$OPCAN_VERSION" -DOPCAN_VULKAN=OFF -DOPCAN_STOCKFISH_PATH="$PWD/packaging/stockfish/stockfish"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-checks
        shell: bash
        run: |
          if [ -f build/Release/opcan_check.exe ]; then build/Release/opcan_check.exe; else build/opcan_check; fi

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: opcan-${{ matrix.name }}
          path: |
            build/opcan-*.exe
            build/opcan-*.zip
            build/opcan-*.dmg
            build/opcan-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags and history for the changelog
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # "What's new": commit subjects since the previous release tag (CI / test-only commits left out); the in-app
      # update dialog shows this section
      - name: Changelog
        run: |
          cd src
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          { echo "## What's new"; echo
            git log --no-merges --pretty='- %s' "$range" | grep -vE '^- (CI|Tests?)[:(]' | head -n 60 || true
            echo; } > ../changes.md
          cat ../changes.md
      # one plainly named download per platform (the in-app updater matches these names too)
      - name: Name the downloads
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir out
          for f in dist/*; do
            case "$f" in
              *windows*.exe) n="opcan-$v-windows-setup.exe" ;;
              *windows*.zip) n="opcan-$v-windows-portable.zip" ;;
              *darwin-arm64*.dmg) n="opcan-$v-macos-apple-silicon.dmg" ;;
              *darwin-x86_64*.dmg) n="opcan-$v-macos-intel.dmg" ;;
              *linux*.tar.gz) n="opcan-$v-linux-x86_64.tar.gz" ;;
              *) echo "unexpected package: $f"; exit 1 ;;
            esac
            mv "$f" "out/$n"
          done
          ls -l out
          cat > notes.md <<EOF
          ## Download

          | System | File |
          |---|---|
          | Windows 10/11 | [opcan-$v-windows-setup.exe](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/opcan-$v-windows-setup.exe) (installer), or the portable [.zip](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/opcan-$v-windows-portable.zip) |
          | macOS, Apple silicon (M1 and later) | [opcan-$v-macos-apple-silicon.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/opcan-$v-macos-apple-silicon.dmg) |
          | macOS, Intel | [opcan-$v-macos-intel.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/opcan-$v-macos-intel.dmg) |
          | Linux x86_64 | [opcan-$v-linux-x86_64.tar.gz](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/opcan-$v-linux-x86_64.tar.gz) (portable: unpack and run bin/opcan), or Nix: \`nix run github:$GITHUB_REPOSITORY\` |

          The apps aren't signed: on Windows click "More info > Run anyway", on macOS right-click the app > Open the first time.
          opcan updates itself from here (Settings > Updates).
          EOF
          sed -i 's/^          //' notes.md
          cat changes.md notes.md > body.md
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body_path: body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
