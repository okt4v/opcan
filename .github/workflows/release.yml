# Builds installers for Windows (NSIS + zip), macOS (.dmg, arm64 and x86_64) and Linux (.tar.gz),
# runs the self-checks, and uploads the packages as artifacts. Runs on version tags (v*) or by hand.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-arm64, os: macos-15, arch: arm64 }
          - { name: macos-x86_64, os: macos-15-intel, arch: x86_64 }
          - { name: linux-x86_64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgl-dev libdbus-1-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Fetch Stockfish (Linux/macOS)
        if: runner.os != 'Windows'
        run: packaging/fetch-stockfish.sh packaging/stockfish
      - name: Fetch Stockfish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/fetch-stockfish.ps1 -Out packaging/stockfish

      - name: Put Stockfish on PATH for the self-checks
        shell: bash
        run: echo "${{ github.workspace }}/packaging/stockfish" >> "$GITHUB_PATH"

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DOPCAN_VULKAN=OFF -DOPCAN_STOCKFISH_PATH="${{ github.workspace }}/packaging/stockfish/stockfish.exe"
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DOPCAN_STOCKFISH_PATH="$PWD/packaging/stockfish/stockfish"
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPCAN_VULKAN=OFF -DOPCAN_STOCKFISH_PATH="$PWD/packaging/stockfish/stockfish"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-checks
        shell: bash
        run: |
          if [ -f build/Release/opcan_check.exe ]; then build/Release/opcan_check.exe; else build/opcan_check; fi

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: opcan-${{ matrix.name }}
          path: |
            build/opcan-*.exe
            build/opcan-*.zip
            build/opcan-*.dmg
            build/opcan-*.tar.gz
          if-no-files-found: error
